<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="canonical" href="https://zonepredictor.com/" />
    <meta name="theme-color" content="#000000" />

    <title>ZonePredictor — Predict the next BGMI &amp; PUBG zone</title>
    <meta
      name="description"
      content="Upload a BGMI or PUBG minimap screenshot and ZonePredictor projects where the next safe zone is most likely to form. Trained on tournament footage. Erangel and Miramar."
    />

    <!-- Link previews (WhatsApp, Discord, Telegram, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://zonepredictor.com/" />
    <meta property="og:site_name" content="ZonePredictor" />
    <meta
      property="og:title"
      content="ZonePredictor — Predict the next BGMI &amp; PUBG zone"
    />
    <meta
      property="og:description"
      content="Upload a minimap screenshot, get the projected next circle drawn back onto it. Erangel and Miramar, no account required."
    />
    <meta property="og:image" content="https://zonepredictor.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!--
      Netlify parses this static copy of the contact form at deploy time; the
      React version that users actually see is rendered into #root.
    -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Cloudflare Web Analytics — cookieless, no consent banner needed -->
    <script
      type="module"
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "f1df1da765ec450781aa2785290272db"}'
    ></script>
  </body>
</html>
